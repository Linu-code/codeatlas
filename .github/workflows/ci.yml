name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 类型检查 · 单测 · 构建（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 单测（覆盖分析层纯函数）
        run: npm test

      - name: tree-sitter 兼容性自检
        run: npm run check:tree-sitter

      - name: 生产构建（含语法包复制）
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist
          retention-days: 7

  e2e:
    name: E2E（Playwright / Chromium）
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 构建（E2E 针对生产构建运行）
        run: npm run build

      - name: 运行 E2E
        run: npm run e2e
        env:
          # GitHub 相关用例在没有网络/限流时会自动跳过；这里显式允许
          CI: 'true'

      - name: 上传失败时的报告与截图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  rust-check:
    name: Rust 侧编译检查
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装 WebView2（构建期依赖）
        run: |
          Invoke-WebRequest -Uri https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile $env:TEMP\WebView2Setup.exe
          Start-Process -FilePath $env:TEMP\WebView2Setup.exe -ArgumentList '/silent /install' -Wait

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖并构建
        run: |
          npm ci
          npm run build

      - name: cargo check（不产出安装包，仅验证 Rust 侧可编译）
        working-directory: src-tauri
        run: cargo check --locked
