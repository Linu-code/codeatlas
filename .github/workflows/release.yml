name: Release（Windows exe）

# 打 tag（如 v1.0.0）时构建 Windows 安装包并发布 GitHub Release。
# 文档站部署已拆分到 pages.yml（跟随 main），避免 tag 触发时被
# github-pages environment 的 "Deployment branches and tags" 规则拒绝。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# 最小权限：仅发布 Release 的 job 需要写权限（见 job 级 permissions）
permissions:
  contents: read

jobs:
  build-windows:
    name: 构建 Windows 安装包
    runs-on: windows-latest
    permissions:
      contents: write # 创建/更新 Release 必需

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: 确保 WebView2 运行时可用（构建期）
        run: |
          Invoke-WebRequest -Uri https://go.microsoft.com/fwlink/p/?LinkId=2124703 -OutFile $env:TEMP\WebView2Setup.exe
          Start-Process -FilePath $env:TEMP\WebView2Setup.exe -ArgumentList '/silent /install' -Wait

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装依赖
        run: npm ci

      - name: 单测（发布前把关）
        run: npm test

      - name: 打包 exe（NSIS 安装包 + 可执行文件）
        # 统一使用 build:exe：脚本自动探测并注入 MSVC / Windows SDK 环境，
        # 规避直接 npm run tauri build 时的 link.exe not found（见 docs/ACCEPTANCE.md）
        run: npm run build:exe

      - name: 计算绿色版 exe 的校验和
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path src-tauri/target/release/*.exe | Select-Object -First 1
          Get-FileHash -Path $exe.FullName -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $($exe.Name)" } | Out-File -FilePath SHA256SUMS.txt -Encoding utf8
          Get-Content SHA256SUMS.txt

      # 仅 tag 触发才发布；workflow_dispatch 在分支上手动跑时只做构建验证
      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # tag 本身即发布意图，直接发布为正式版本；
          # 形如 v1.0.0-beta.1 的预发布 tag 会自动标记为 prerelease
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
